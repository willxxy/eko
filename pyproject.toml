[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "eko"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "joblib>=1.6.0",
    "neurokit2==0.2.7",
    "prompt-toolkit>=3.0,<4",
    "rich>=13,<15",
    "scipy>=1.15.3",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[project.scripts]
eko = "host:main"

[tool.setuptools]
py-modules = ["eko", "host", "ui"]
packages = [
    "benchmark",
    "providers",
    "toolbox",
    "toolbox.measurements",
    "toolbox.neural_networks",
    "toolbox.neural_networks.classification",
]
